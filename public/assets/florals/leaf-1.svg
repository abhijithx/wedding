<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 300" fill="none">
  <!-- Eucalyptus leaf sprig - variant 1 -->
  <g opacity="0.85">
    <!-- Stem -->
    <path d="M60 290 Q58 200 55 150 Q52 100 60 10" stroke="#7a8a6e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Leaves -->
    <ellipse cx="45" cy="60" rx="18" ry="28" transform="rotate(-25 45 60)" fill="#A8B5A0" opacity="0.7"/>
    <ellipse cx="75" cy="90" rx="16" ry="24" transform="rotate(20 75 90)" fill="#B5C4AD" opacity="0.6"/>
    <ellipse cx="42" cy="130" rx="20" ry="30" transform="rotate(-30 42 130)" fill="#A8B5A0" opacity="0.65"/>
    <ellipse cx="78" cy="165" rx="15" ry="22" transform="rotate(25 78 165)" fill="#C2CEBC" opacity="0.55"/>
    <ellipse cx="48" cy="200" rx="18" ry="26" transform="rotate(-20 48 200)" fill="#A8B5A0" opacity="0.6"/>
    <ellipse cx="72" cy="235" rx="14" ry="20" transform="rotate(15 72 235)" fill="#B5C4AD" opacity="0.5"/>
    <!-- Leaf veins -->
    <line x1="38" y1="48" x2="52" y2="72" stroke="#8a9a7e" stroke-width="0.5" opacity="0.4"/>
    <line x1="82" y1="78" x2="68" y2="102" stroke="#8a9a7e" stroke-width="0.5" opacity="0.4"/>
    <line x1="34" y1="118" x2="50" y2="142" stroke="#8a9a7e" stroke-width="0.5" opacity="0.4"/>
  </g>
</svg>
