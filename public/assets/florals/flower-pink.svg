<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" fill="none">
  <!-- Blush pink floral petal -->
  <g opacity="0.8">
    <!-- Main petals -->
    <ellipse cx="40" cy="35" rx="22" ry="30" transform="rotate(-15 40 35)" fill="#E8C4C4" opacity="0.7"/>
    <ellipse cx="50" cy="40" rx="20" ry="28" transform="rotate(10 50 40)" fill="#EDCFCF" opacity="0.6"/>
    <ellipse cx="35" cy="45" rx="18" ry="25" transform="rotate(-25 35 45)" fill="#E8C4C4" opacity="0.65"/>
    <ellipse cx="45" cy="30" rx="16" ry="22" transform="rotate(20 45 30)" fill="#F0D5D5" opacity="0.55"/>
    <ellipse cx="42" cy="50" rx="14" ry="20" transform="rotate(-5 42 50)" fill="#E8C4C4" opacity="0.5"/>
    <!-- Center -->
    <circle cx="42" cy="40" r="6" fill="#D4A5A5" opacity="0.5"/>
    <circle cx="42" cy="40" r="3" fill="#C9A15D" opacity="0.4"/>
    <!-- Small stem -->
    <path d="M42 60 Q40 75 38 95" stroke="#7a8a6e" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
